[package]
name = "sr_download"
version = "1.3.3"
edition = "2024"
default-run = "sr_download"

[dependencies]
# 显式使用 rustls，兼容不依赖 OpenSSL 的 musl 构建。
reqwest = { version = "0.13.5", features = ["rustls", "http2", "charset"], default-features = false }
colored = "3.1.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
anyhow = { version = "1.0.104", features = ["backtrace"] }
axum = "0.8.9"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "macros",
    "chrono",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
toml = "1.1.8"
blake3 = "1.8.7"
# 0.42 改变属性控制字符的转义输出；保留 0.41 以维持现有读写行为。
quick-xml = { version = "0.41.0", features = ["serialize"] }
chrono = "0.4.45"
humantime = "2.4.0"
clap = { version = "4.6.7", features = ["derive"] }
